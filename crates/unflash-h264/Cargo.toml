[package]
name = "unflash-h264"
version.workspace = true
edition.workspace = true
description = "A small H.264 / AVC decoder (Constrained Baseline, Main and High, 4:2:0 8-bit, progressive and interlaced) for browsers without one"
license.workspace = true
repository.workspace = true

[dependencies]
unflash-codec = { path = "../unflash-codec" }
wide = { workspace = true, optional = true }

[dev-dependencies]
unflash-mp4 = { path = "../unflash-mp4" }
unflash-testkit = { path = "../unflash-testkit" }
md5.workspace = true

[features]
default = ["simd"]
simd = ["dep:wide"]

[lints]
workspace = true
