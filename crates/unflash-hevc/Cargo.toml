[package]
name = "unflash-hevc"
version.workspace = true
edition.workspace = true
description = "A small HEVC / H.265 decoder (Main, Main 10 and Main Still Picture, 4:2:0) for browsers without one"
license.workspace = true
repository.workspace = true

[dependencies]
unflash-codec = { path = "../unflash-codec" }
wide = { workspace = true, optional = true }

[dev-dependencies]
unflash-mp4 = { path = "../unflash-mp4" }
unflash-testkit = { path = "../unflash-testkit" }
md5.workspace = true

[features]
default = ["simd"]
simd = ["dep:wide"]

[lints]
workspace = true
