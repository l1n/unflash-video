[package]
name = "unflash-vp8"
version.workspace = true
edition.workspace = true
description = "A small VP8 decoder (RFC 6386, all profiles) for browsers without one"
license.workspace = true
repository.workspace = true

[dependencies]
unflash-codec = { path = "../unflash-codec" }
bytemuck = { workspace = true, optional = true }
wide = { workspace = true, optional = true }

[dev-dependencies]
unflash-mp4 = { path = "../unflash-mp4" }
md5.workspace = true

[features]
default = ["simd"]
simd = ["dep:wide", "dep:bytemuck"]

[lints]
workspace = true
