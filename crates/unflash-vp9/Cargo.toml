[package]
name = "unflash-vp9"
version.workspace = true
edition.workspace = true
description = "A small VP9 decoder (profiles 0 and 2: 8, 10 and 12-bit 4:2:0) for browsers without one"
license.workspace = true
repository.workspace = true

[dependencies]
unflash-codec = { path = "../unflash-codec" }
wide = { workspace = true, optional = true }

[dev-dependencies]
unflash-mp4 = { path = "../unflash-mp4" }
unflash-testkit = { path = "../unflash-testkit" }

[features]
default = ["simd"]
simd = ["dep:wide"]

[lints]
workspace = true
