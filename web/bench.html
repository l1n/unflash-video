<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unflash benchmark</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>body{font:14px system-ui;background:#15171c;color:#e6e8ee;padding:20px;max-width:900px}pre{background:#1d2027;padding:10px;border-radius:6px;white-space:pre-wrap}button{padding:6px 12px}</style>
</head>
<body>
<h1>Unflash detector benchmark</h1>
<p>Feeds synthetic flashing frames straight into the detector (no video decoding) and reports the sustained throughput of the WebGPU stage and the CPU (WebAssembly) stage, plus the effective memory traffic. Source: <input id="src" value="1920x1080" size="9"> analysis scale: <input id="scale" value="0.25" size="4"> frames: <input id="n" value="300" size="5"> <button id="run">Run</button></p>
<pre id="out">…</pre>
<script type="module">
import init, * as wasm from './pkg/unflash.js';
const out = document.getElementById('out');
const log = (s) => { out.textContent += s + '\n'; };
await init();
async function bench(kind, cfgJson, w, h, n) {
  const det = kind === 'gpu' ? await wasm.Detector.createGpu(cfgJson, w, h) : new wasm.Detector(cfgJson, w, h);
  const aw = det.analysis_width(), ah = det.analysis_height();
  // frames at the analysis size for the CPU (its natural input) and at the source size for the GPU
  const fw = kind === 'gpu' ? w : aw, fh = kind === 'gpu' ? h : ah;
  const frames = [];
  for (let k = 0; k < 8; k++) {
    const f = new Uint8Array(fw * fh * 4);
    const phase = (k >> 1) & 1;
    for (let i = 0; i < fw * fh; i++) {
      const x = i % fw, y = (i / fw) | 0;
      const inRect = x > fw * 0.2 && x < fw * 0.8 && y > fh * 0.2 && y < fh * 0.8;
      const c = inRect ? (phase ? 200 : 30) : 60 + ((x * 7 + y * 13 + k) % 17);
      f[i * 4] = c; f[i * 4 + 1] = c; f[i * 4 + 2] = c; f[i * 4 + 3] = 255;
    }
    frames.push(f);
  }
  const tick = () => new Promise((r) => setTimeout(r, 0));
  // warm up
  det.feed_rgba(frames[0], fw, fh, 0, false);
  while (det.pending() > 0) { det.poll(); await tick(); }
  det.reset();
  const t0 = performance.now();
  let busy = 0;
  for (let i = 0; i < n; i++) {
    while (!det.can_submit()) { det.poll(); await tick(); }
    const a = performance.now();
    det.feed_rgba(frames[i % 8], fw, fh, i / 30, false);
    busy += performance.now() - a;
    det.poll();
  }
  while (det.pending() > 0) { det.poll(); await tick(); }
  const ms = performance.now() - t0;
  const res = JSON.parse(det.finish(false));
  const bpf = det.bytes_per_frame();
  const fps = n / (ms / 1000);
  log(`${kind.padEnd(4)} ${w}x${h} -> ${aw}x${ah}: ${n} frames in ${ms.toFixed(0)} ms = ${fps.toFixed(1)} fps, ${(ms / n).toFixed(2)} ms/frame (main thread busy ${(busy / n).toFixed(2)} ms/frame), ≈${(bpf * fps / 1e9).toFixed(2)} GB/s state traffic, ${(aw * ah * fps / 1e6).toFixed(1)} Mpx/s; violations: ${res.violations.length}, held: ${res.held}`);
  det.free();
  return { kind, fps, ms, violations: res.violations.length, frames: res.frames };
}
window.runBench = async () => {
  out.textContent = '';
  const [w, h] = document.getElementById('src').value.split('x').map(Number);
  const scale = parseFloat(document.getElementById('scale').value);
  const n = parseInt(document.getElementById('n').value, 10);
  const cfg = JSON.parse(wasm.profile_config('wcag_ext'));
  cfg.analysis_scale = scale;
  const cfgJson = JSON.stringify(cfg);
  const results = {};
  if (navigator.gpu) {
    try { results.gpu = await bench('gpu', cfgJson, w, h, n); } catch (e) { log('gpu: ' + e); }
  } else log('no WebGPU');
  results.cpu = await bench('cpu', cfgJson, w, h, n);
  window.benchResults = results;
  return results;
};
document.getElementById('run').addEventListener('click', runBench);
if (location.hash === '#auto') runBench();
</script>
</body>
</html>
